<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helios Hub - Login & Sign Up</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
</head>
<body style="justify-content: center; align-items: center; padding: 2rem 1rem;">

  <div class="card" style="max-width: 440px; width: 100%; margin: 0 auto;">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <span style="font-size: 3rem;">☀️</span>
      <h1 style="font-size: 1.8rem; font-weight: 800; margin-top: 0.5rem;">Helios Hub</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Sign in or create your account</p>
    </div>

    <!-- TABS -->
    <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem;">
      <button id="tabBtnSignIn" class="btn btn-primary" style="flex: 1;" onclick="showAuthTab('signin')">Sign In</button>
      <button id="tabBtnSignUp" class="btn btn-secondary" style="flex: 1;" onclick="showAuthTab('signup')">Sign Up</button>
    </div>

    <!-- SIGN IN FORM -->
    <form id="signInForm" onsubmit="event.preventDefault(); submitSignIn();">
      <div class="form-group">
        <label>Email or Username</label>
        <input type="text" id="signInEmail" class="form-control" placeholder="user@helios.edu or username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signInPassword" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
    </form>

    <!-- SIGN UP FORM -->
    <form id="signUpForm" style="display: none;" onsubmit="event.preventDefault(); submitSignUp();">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signUpFullName" class="form-control" placeholder="Alex Morgan" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="signUpEmail" class="form-control" placeholder="alex@helios.edu" required>
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="signUpUsername" class="form-control" placeholder="alexm" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signUpPassword" class="form-control" placeholder="••••••••" required>
      </div>

      <!-- SECTION DROPDOWN -->
      <div class="form-group">
        <label>Section</label>
        <select id="signUpSection" class="form-control">
          <option value="Aether">Aether</option>
          <option value="Gaia">Gaia</option>
          <option value="Helios" selected>Helios</option>
          <option value="Luna">Luna</option>
          <option value="Nova">Nova</option>
        </select>
      </div>

      <!-- CIRCLE OF FRIENDS DROPDOWN -->
      <div class="form-group">
        <label>Circle of Friends</label>
        <select id="signUpCircle" class="form-control">
          <option value="FF" selected>FF (Friends Forever)</option>
          <option value="CGoC">CGoC</option>
          <option value="EXMM">EXMM</option>
          <option value="GS">GS</option>
          <option value="GCkS">GCkS</option>
          <option value="67???">67???</option>
          <option value="GsmP">GsmP</option>
          <option value="4GOJ">4GOJ</option>
          <option value="HW">HW</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Account & Sign In</button>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      enforceAuthGuard("login");
    });

    function showAuthTab(tab) {
      const signInForm = document.getElementById("signInForm");
      const signUpForm = document.getElementById("signUpForm");
      const btnIn = document.getElementById("tabBtnSignIn");
      const btnUp = document.getElementById("tabBtnSignUp");

      if (tab === "signin") {
        signInForm.style.display = "block";
        signUpForm.style.display = "none";
        btnIn.className = "btn btn-primary";
        btnUp.className = "btn btn-secondary";
      } else {
        signInForm.style.display = "none";
        signUpForm.style.display = "block";
        btnIn.className = "btn btn-secondary";
        btnUp.className = "btn btn-primary";
      }
    }

    async function submitSignIn() {
      const email = document.getElementById("signInEmail").value;
      const pass = document.getElementById("signInPassword").value;
      await handleSignIn(email, pass);
    }

    async function submitSignUp() {
      const name = document.getElementById("signUpFullName").value;
      const email = document.getElementById("signUpEmail").value;
      const user = document.getElementById("signUpUsername").value;
      const pass = document.getElementById("signUpPassword").value;
      const sec = document.getElementById("signUpSection").value;
      const circle = document.getElementById("signUpCircle").value;
      await handleSignUp(email, pass, name, user, sec, circle);
    }
  </script>
</body>
</html>
