<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helios Hub - Grade 8 Classes</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <div id="mainHeader"></div>

  <main class="container">
    <div class="card">
      <h1 class="card-title">📚 Grade 8 Curriculum Classes</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">
        Attributes and properties added here belong strictly to their specific subject.
      </p>

      <!-- SUBJECT TABS -->
      <div class="class-tabs">
        <button class="class-tab-btn active" onclick="switchClassTab('science', event)">Science</button>
        <button class="class-tab-btn" onclick="switchClassTab('research', event)">Research</button>
        <button class="class-tab-btn" onclick="switchClassTab('mathematics', event)">Mathematics</button>
        <button class="class-tab-btn" onclick="switchClassTab('english', event)">English</button>
        <button class="class-tab-btn" onclick="switchClassTab('filipino', event)">Filipino</button>
        <button class="class-tab-btn" onclick="switchClassTab('values', event)">Values Education</button>
        <button class="class-tab-btn" onclick="switchClassTab('ap', event)">Araling Panlipunan</button>
        <button class="class-tab-btn" onclick="switchClassTab('mapeh', event)">MAPEH</button>
        <button class="class-tab-btn" onclick="switchClassTab('creative_tech', event)">Creative Technologies</button>
      </div>

      <!-- ADD PROPERTY -->
      <div class="grid-2" style="margin-bottom: 1.5rem;">
        <input type="text" id="propKeyInput" class="form-control" placeholder="Property Name (e.g. Teacher, Room, Schedule)">
        <input type="text" id="propValInput" class="form-control" placeholder="Property Value (e.g. Dr. Smith, Lab 3, Mon/Wed 9AM)">
      </div>
      <button class="btn btn-primary" onclick="addClassProperty()" style="margin-bottom: 1.5rem;">+ Add Class Attribute/Property</button>

      <!-- PROPERTIES LIST -->
      <div id="propertiesList">
        <p style="color: var(--text-muted);">Loading class properties...</p>
      </div>
    </div>
  </main>

  <footer>
    <p>Helios Hub v11 &copy; 2026. Grade 8 Curriculum Subject Attributes.</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      enforceAuthGuard("protected");
      initClassesPage();
    });
  </script>
</body>
</html>
