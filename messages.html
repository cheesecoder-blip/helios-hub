<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helios Hub - Real-Time Messaging</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <div id="mainHeader"></div>

  <main class="container">
    <div class="card">
      <h1 class="card-title">💬 Real-Time Messaging</h1>
      <div class="chat-layout">
        <!-- CHAT SIDEBAR -->
        <div class="chat-sidebar" id="chatSidebarContent">
          <p style="color: var(--text-muted);">Loading channels...</p>
        </div>

        <!-- CHAT WINDOW -->
        <div class="chat-window">
          <div class="chat-header" id="chatTitle">Loading chat...</div>
          <div class="chat-messages" id="chatMessages">
            <p style="color: var(--text-muted);">Loading chat messages...</p>
          </div>
          <div class="chat-input-row">
            <input type="text" id="chatInput" class="form-control" placeholder="Type your message..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button class="btn btn-primary" onclick="sendMessage()">Send</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>Helios Hub v11 &copy; 2026. Powered by Supabase Realtime.</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      enforceAuthGuard("protected");
      initMessagesPage();
    });
  </script>
</body>
</html>
