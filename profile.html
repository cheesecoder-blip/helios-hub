<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Helios Hub - Profile Settings</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</head>
<body>
  <div id="mainHeader"></div>

  <main class="container">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
      <h1 class="card-title">👤 Profile Settings & Avatar Positioner</h1>

      <!-- PFP PREVIEW -->
      <div class="pfp-preview-container">
        <img id="avatarPreviewImg" class="pfp-preview-img" src="" alt="PFP" style="display: none;">
      </div>

      <!-- FILE UPLOAD FOR AVATAR -->
      <div class="form-group">
        <label>Upload Avatar Image</label>
        <input type="file" id="avatarFileInput" class="form-control" accept="image/*" onchange="handleAvatarFileSelect(event)">
      </div>

      <!-- AVATAR TRANSFORM CONTROLS -->
      <div class="grid-3" style="margin-bottom: 1.5rem;">
        <div>
          <label style="font-size: 0.8rem; color: var(--text-muted);">Zoom</label>
          <input type="range" id="zoomSlider" min="1" max="3" step="0.1" value="1" class="form-control" oninput="updateAvatarTransformStyles()">
        </div>
        <div>
          <label style="font-size: 0.8rem; color: var(--text-muted);">Pan X</label>
          <input type="range" id="xSlider" min="-100" max="100" step="1" value="0" class="form-control" oninput="updateAvatarTransformStyles()">
        </div>
        <div>
          <label style="font-size: 0.8rem; color: var(--text-muted);">Pan Y</label>
          <input type="range" id="ySlider" min="-100" max="100" step="1" value="0" class="form-control" oninput="updateAvatarTransformStyles()">
        </div>
      </div>

      <!-- USER PROFILE DETAILS -->
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="profileFullNameInput" class="form-control">
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Section</label>
          <select id="profileSectionSelect" class="form-control">
            <option value="Aether">Aether</option>
            <option value="Gaia">Gaia</option>
            <option value="Helios">Helios</option>
            <option value="Luna">Luna</option>
            <option value="Nova">Nova</option>
          </select>
        </div>

        <div class="form-group">
          <label>Circle of Friends</label>
          <select id="profileCircleSelect" class="form-control">
            <option value="FF">FF (Friends Forever)</option>
            <option value="CGoC">CGoC</option>
            <option value="EXMM">EXMM</option>
            <option value="GS">GS</option>
            <option value="GCkS">GCkS</option>
            <option value="67???">67???</option>
            <option value="GsmP">GsmP</option>
            <option value="4GOJ">4GOJ</option>
            <option value="HW">HW</option>
          </select>
        </div>
      </div>

      <button class="btn btn-primary" style="width: 100%; margin-top: 1rem;" onclick="saveProfileSettings()">Save Profile & Avatar Settings</button>
    </div>
  </main>

  <footer>
    <p>Helios Hub v11 &copy; 2026. Custom Profile Customization.</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      enforceAuthGuard("protected");
      initProfilePage();
    });
  </script>
</body>
</html>
